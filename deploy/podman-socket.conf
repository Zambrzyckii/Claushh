# A user drop-in for the podman.socket of workspace (docs/PLAN.md, "Deployment decisions"): the socket moves into the
# home directory, which claushh.service binds, so docker and Testcontainers in the portal terminal reach Podman.
# Copied to /home/workspace/.config/systemd/user/podman.socket.d/claushh.conf; %h is that user's home.
[Socket]
ListenStream=
ListenStream=%h/.local/state/podman/podman.sock
