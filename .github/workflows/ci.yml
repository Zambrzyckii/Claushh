# Runs the frontend's integration tests, build and e2e tests (on the mock API) and the backend's integration tests for
# every push to main and every pull request. Described in docs/ARCHITECTURE.md, "Repository map".
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:only

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The terminal needs tmux 3.7 or later (README.md, "Running in development"), newer than Ubuntu's own.
      - name: Build tmux 3.7c
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev libncurses-dev bison pkg-config
          curl -fsSL -o "$RUNNER_TEMP/tmux-3.7c.tar.gz" https://github.com/tmux/tmux/releases/download/3.7c/tmux-3.7c.tar.gz
          echo "7c60cae9a0e25288e2e24750aafc9e8800fc7fd4555e447e1b29ee4201cfb3bf  $RUNNER_TEMP/tmux-3.7c.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/tmux-3.7c.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/tmux-3.7c"
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          tmux -V
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # The tests start their shell as /bin/sh (tests/Claushh.Api.Tests/ApiFactory.cs) and rely on a line-editing shell
      # like bash, which is /bin/sh on Arch. Ubuntu's dash echoes typed text before its first prompt.
      - name: Use bash as /bin/sh
        run: sudo ln -sf bash /bin/sh && readlink -f /bin/sh
      - run: dotnet test
