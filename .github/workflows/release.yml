# Builds the self-contained API, the frontend and deploy/ with deploy/install.sh whenever a release is published,
# attaches them to the release as claushh-<tag>-linux-x64.tar.gz and publishes the same files as the package
# ghcr.io/zambrzyckii/claushh, an image that holds them under /claushh and runs nothing. docs/DEPLOYMENT.md, "Updates",
# says how to install from either. Described in docs/ARCHITECTURE.md, "Repository map".
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      # The build runs the dependencies' install scripts, so the token that can write stays out of the checkout.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: deploy/install.sh build "$RUNNER_TEMP/claushh"
      - name: Package
        run: tar -czf "$RUNNER_TEMP/claushh-$TAG-linux-x64.tar.gz" -C "$RUNNER_TEMP/claushh" api web deploy
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/claushh-$TAG-linux-x64.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"
      # After the upload, so that a registry failure cannot cost the release its archive. GHCR takes lowercase names
      # only, and the source label links the package to this repository.
      - name: Publish the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'FROM scratch\nCOPY api /claushh/api\nCOPY web /claushh/web\nCOPY deploy /claushh/deploy\n' |
            docker build -f - -t "$image:${TAG#v}" -t "$image:latest" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.description=The Claushh $TAG build for linux-x64 (the API, the frontend and deploy/) under /claushh. The image holds files only and runs nothing." \
              "$RUNNER_TEMP/claushh"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$image"
