# Builds the self-contained API, the frontend and deploy/ with deploy/install.sh whenever a release is published and
# attaches them to the release as claushh-<tag>-linux-x64.tar.gz. README.md, "Updates", says how to install it.
# Described in docs/ARCHITECTURE.md, "Repository map".
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      # The build runs the dependencies' install scripts, so the token that can write stays out of the checkout.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: deploy/install.sh build "$RUNNER_TEMP/claushh"
      - name: Package
        run: tar -czf "$RUNNER_TEMP/claushh-$TAG-linux-x64.tar.gz" -C "$RUNNER_TEMP/claushh" api web deploy
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/claushh-$TAG-linux-x64.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"
