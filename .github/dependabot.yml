# Weekly version updates. npm in web/ brings its minor and patch updates in one pull request and each major update in
# its own. The workflow's actions come in one pull request. NuGet is left out because CI does not run the backend's
# tests. Described in docs/ARCHITECTURE.md, "Repository map".
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
