<div class="header">
  <span>EKSPLORATOR</span>
  <button type="button" class="header__refresh" (click)="refresh()">Odśwież</button>
</div>

<div class="tree">
  @for (row of rows(); track $index) {
    @if (row.kind === 'entry') {
      <button type="button" class="row" [class.row--active]="row.entry.path === activePath()"
              [style.padding-left.px]="16 + row.depth * 14" [title]="row.entry.path"
              [attr.aria-expanded]="row.entry.kind === 'directory' ? row.expanded : null"
              (click)="select(row)">
        @if (row.entry.kind === 'directory') {
          <span class="row__chevron" aria-hidden="true">{{ row.expanded ? '▾' : '▸' }}</span>
        } @else {
          <span class="row__chevron" aria-hidden="true"></span>
        }
        <span class="row__name">{{ row.entry.name }}</span>
      </button>
    } @else {
      <p class="status" [class.status--error]="row.error" [style.padding-left.px]="16 + row.depth * 14">{{ row.text }}</p>
    }
  }
</div>
