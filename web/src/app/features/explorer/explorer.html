<div class="header">
  <button type="button" class="header__toggle" [attr.aria-expanded]="!collapsed()" [title]="label()"
          (click)="collapsed.set(!collapsed())">
    <span class="codicon" [class.codicon-chevron-down]="!collapsed()" [class.codicon-chevron-right]="collapsed()" aria-hidden="true"></span>
    <span class="header__label section-title">{{ label() }}</span>
  </button>
  <button type="button" class="header__refresh icon" aria-label="Refresh" title="Refresh" (click)="refreshClicked()"><span class="codicon codicon-refresh" aria-hidden="true"></span></button>
  <button type="button" class="icon" aria-label="Collapse All" title="Collapse All" (click)="collapseAll()"><span class="codicon codicon-collapse-all" aria-hidden="true"></span></button>
</div>

@if (!collapsed()) {
  <div class="tree">
    @for (row of rows(); track $index) {
      @if (row.kind === 'entry') {
        <button type="button" class="row" [class.row--active]="row.entry.path === activePath()"
                [attr.data-mark]="decorations().get(row.entry.path) ?? null"
                [style.padding-left.px]="4 + row.depth * 8" [title]="row.entry.path"
                [attr.aria-expanded]="row.entry.kind === 'directory' ? row.expanded : null"
                (click)="select(row)">
          @if (row.entry.kind === 'directory') {
            <span class="row__chevron codicon" [class.codicon-chevron-down]="row.expanded" [class.codicon-chevron-right]="!row.expanded" aria-hidden="true"></span>
          } @else {
            <span class="row__chevron" aria-hidden="true"></span>
          }
          <img class="file-icon" [src]="icon(row)" alt="" width="16" height="16" draggable="false">
          <span class="row__name">{{ row.entry.name }}</span>
          @if (decorations().get(row.entry.path); as mark) {
            <span class="row__mark" [class.row__mark--dir]="row.entry.kind === 'directory'"
                  [attr.aria-label]="markLabel(mark)" [title]="markLabel(mark)">{{ mark }}</span>
          }
        </button>
      } @else {
        <p class="status" [class.status--error]="row.error" [style.padding-left.px]="24 + row.depth * 8">{{ row.text }}</p>
      }
    }
  </div>
}
