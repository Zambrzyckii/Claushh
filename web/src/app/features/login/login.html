<form class="login" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <h1>Workspace</h1>

  @if (notice(); as n) {
    <p class="notice" [class.notice--warning]="n.warning" role="status">{{ n.text }}</p>
  }
  @if (logoutUnconfirmed()) {
    <button type="button" class="secondary" [disabled]="retryingLogout() || submitting()" (click)="retryLogout()">
      {{ retryingLogout() ? 'Logging out…' : 'Retry logout' }}
    </button>
  }

  <label for="userName">User name</label>
  <input id="userName" formControlName="userName" type="text"
         autocomplete="username" autocapitalize="none" spellcheck="false" required>

  <label for="password">Password</label>
  <input id="password" formControlName="password" type="password"
         autocomplete="current-password" required>

  <label for="totpCode">Authenticator code</label>
  <input id="totpCode" formControlName="totpCode" type="text" inputmode="numeric"
         autocomplete="one-time-code" spellcheck="false" maxlength="6" required>

  @if (error(); as message) {
    <p class="error" role="alert">{{ message }}</p>
  }

  <button type="submit" [disabled]="submitting()">
    {{ submitting() ? 'Logging in…' : 'Log in' }}
  </button>
</form>
