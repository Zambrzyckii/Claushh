<app-title-bar [loggingOut]="loggingOut()" (security)="openSecurity()" (logout)="logout()" (repository)="showRepository()" />

@if (layout.phone()) {
  <app-phone-panes [(tab)]="phoneTab" />
} @else {
  <div class="main">
    <app-side-bar class="sidebar" [class.sidebar--closed]="!state.sideBarOpen()" />

    <div class="center">
      <main class="editor">
        <app-editor-pane />
      </main>

      @if (state.panelOpen()) {
        <section class="bottom" aria-label="Panel" animate.enter="slide-in-up" animate.leave="slide-out-down">
          <div class="bottom__bar">
            <div class="bottom__tabs" role="tablist" aria-label="Panel views">
              <button type="button" role="tab" id="panel-tab-terminal" aria-selected="true" aria-controls="panel-terminal">TERMINAL</button>
            </div>
            <button type="button" class="bottom__collapse icon" aria-label="Hide panel" title="Hide panel" (click)="state.panelOpen.set(false)">
              <span class="codicon codicon-close" aria-hidden="true"></span>
            </button>
          </div>
          <div class="bottom__content" id="panel-terminal" role="tabpanel" aria-labelledby="panel-tab-terminal">
            <app-terminal-panel />
          </div>
        </section>
      }
    </div>

    @if (state.consoleOpen()) {
      <aside class="console" aria-label="Console" animate.enter="slide-in-right" animate.leave="slide-out-right">
        <app-console-panel (collapse)="state.consoleOpen.set(false)" />
      </aside>
    }
  </div>
}

<app-status-bar [editorShown]="!layout.phone() || phoneTab() === 'editor'" />

<app-security-dialog [unsavedCount]="editor.unsavedCount()" (logoutEverywhere)="logout(true)" />
